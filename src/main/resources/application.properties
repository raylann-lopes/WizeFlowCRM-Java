spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -- Datasource (PostgreSQL) --
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== SECURITY ==========
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ========== CORS ==========
# Configure allowed origins per environment. Multiple origins can be provided as comma-separated values.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# Optionally configure allowed methods/headers/exposed headers and other CORS settings
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept
cors.exposed-headers=Authorization
cors.allow-credentials=true
cors.max-age=3600
